# Clippy configuration for the workspace (DESIGN.md L441, L1111). Unit xt-lint-rust.
#
# The simulation's determinism rules, checked with type information next to the text lints in
# `cargo xtask lint` (rust.transcendentals, rust.hash-iteration). Clippy reads this file for every crate;
# sim-core, sim-systems and content are the crates the rules govern. A crate outside the simulation that
# needs std floats or a hashed map for speed (rendering, audio synthesis) allows the two lints at its root:
#   #![allow(clippy::disallowed_types, clippy::disallowed_methods)]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is random per process; use BTreeMap, IndexMap with a fixed hasher, or ascending-id vectors (L1111)" },
    { path = "std::collections::HashSet", reason = "iteration order is random per process; use BTreeSet, IndexSet with a fixed hasher, or ascending-id vectors (L1111)" },
]

disallowed-methods = [
    { path = "f64::sin", reason = "not bit-identical across platforms; use libm::sin (L441)" },
    { path = "f64::cos", reason = "use libm::cos (L441)" },
