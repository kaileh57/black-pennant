; Release export presets. DESIGN.md "Distribution and signing" (L1274-1280) and the macOS floor (L1264).
; Built by `cargo xtask release`, locally and in .github/workflows/release.yml. Options left out take
; Godot's defaults. Export signing is off on both: the release task ad-hoc signs the macOS bundle inside
; out (L1278), and Windows builds are unsigned (L1280).
;
; Filters: every resource is exported, minus the test harnesses and placeholder art. The include filter adds
; the non-resource files the game reads at run time: the generated texture blobs (art/gen/*.bin, read by
; Rust through FileAccess), the English text CSVs (read by the I18n autoload, which never uses the editor's
; imported .translation files) and the font licence shown by the credits screen.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="i18n/*.csv, art/gen/*.bin, art/tokens/*.json, ui/theme/*.json, ui/fonts/licenses/*.txt"
exclude_filter="_placeholder/*, test/*, i18n/*.translation"
export_path="../target/bp-release/macos/Black Pennant.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=1
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon="res://ui/icons/app_icon.svg"
application/icon_interpolation=4
application/bundle_identifier="io.github.kaileh57.blackpennant"
application/signature=""
application/app_category="Games"
application/short_version=""
application/version=""
application/copyright="Black Pennant contributors. Code MIT or Apache 2.0; data CC BY 4.0."
application/min_macos_version_arm64="14.00"
application/export_angle=0
display/high_res=true
shader_baker/enabled=true
codesign/codesign=0
notarization/notarization=0
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true

