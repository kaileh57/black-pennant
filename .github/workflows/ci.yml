name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted standard runners only, free for public repositories, pinned by label (DESIGN.md L1286).
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Luau host (luau feature)
        run: cargo test -p sim-systems --features luau --locked --lib 'script::'
      - name: Lints
        run: cargo xtask lint
      - name: Generators are deterministic
        shell: bash
        run: |
          cargo xtask gen
          cargo xtask gen --check
      - name: Sim crates keep the determinism rules (clippy disallowed types and methods)
        run: cargo clippy -p sim-core -p sim-systems -p content --all-targets --locked -- -D clippy::disallowed_types -D clippy::disallowed_methods
      - name: Reference battle state hash, identical on 1 and 3 sim threads
        shell: bash
        run: |
          cargo build -p server --release --locked
          bin=target/release/black-pennant-server
          "$bin" reference-battle --ticks 3600 --subsystems --threads 3 > hash3.txt
          "$bin" reference-battle --ticks 3600 --subsystems --threads 1 > hash1.txt
          cat hash3.txt
          diff hash3.txt hash1.txt
      - name: Trial battery (stock ships)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          for bp in blueprints/starters/*.bp.ron; do
            target/release/black-pennant-server trials --blueprint "$bp" --spec short
          done

  soak:
    if: github.event_name != 'schedule'
    name: server soak (linux)
    runs-on: ubuntu-24.04
    # The client_p95_kbps bandwidth gate fails today; the run still reports every gate. Drop
    # continue-on-error when it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-soak-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the server
        run: cargo build -p server --release --locked
      - name: Dedicated-server soak, 2 bots, 5 minutes (DESIGN.md L1290)
        run: target/release/black-pennant-server soak --minutes 5 --clients 2 --out soak.ron
      - name: Degradation ladder under synthetic overload (2 minutes, so the load drop leaves time to reach rung 0)
        if: always()
        run: target/release/black-pennant-server soak --minutes 2 --synthetic-tick-ms 14 --out soak-overload.ron

  godot-smoke:
    if: github.event_name != 'schedule'
    name: godot smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-godot-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the client library
        run: cargo build -p gdclient --locked
      - name: Generate files
        run: cargo xtask gen
      - name: Download Godot
        shell: bash
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_win64.exe.zip"
            unzip -q godot.zip
            echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"
          else
            curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_macos.universal.zip"
            unzip -q godot.zip
            echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          fi
      - name: Import and smoke test
        shell: bash
        run: |
          "$GODOT" --headless --path game --import || true
          "$GODOT" --headless --path game -- --smoke 2>&1 | tee smoke.log
          if grep -E "ERROR|SCRIPT ERROR|Parse Error|panicked" smoke.log; then exit 1; fi
      # Suspend and resume (DESIGN.md L112, L826-828): a campaign sortie is saved, left and resumed twice. It
      # writes a campaign and a suspend save, so user data goes to a scratch home on both runners.
      - name: Suspend and resume (resume_play)
        shell: bash
        run: |
          rm -rf scratch-home && mkdir scratch-home
          if [ "$RUNNER_OS" = "Windows" ]; then
            export APPDATA="$(cygpath -w "$PWD/scratch-home")"
          else
            export HOME="$PWD/scratch-home"
          fi
          "$GODOT" --headless --path game res://test/ui/resume_play.tscn 2>&1 | tee resume.log
          if grep -E "ERROR|SCRIPT ERROR|Parse Error|panicked|resume: FAIL" resume.log; then exit 1; fi
      - name: UI lint (theme, scenes, scripts, copy, fonts)
        shell: bash
        run: |
          "$GODOT" --headless --path game -s res://test/lint/ui_lint.gd

  steam-feature:
    name: steam feature builds (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo build -p net -p server --features steam --locked
